name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q main.py config_manager.py platform_client.py render.py admin_cli.py scripts tests
      - name: Check public files
        run: python scripts/check_public_files.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build runtime package
        run: python scripts/package.py --out dist
